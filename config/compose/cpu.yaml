# CPU fallback overlay for `podman compose -f compose.yaml -f compose.cpu.yaml`.
# Used automatically by `scripts/deploy.py up` when NVIDIA CDI is unavailable
# (unresolvable nvidia.com/gpu=all). See docs/guides/troubleshooting-gpu.md.

services:
  llm:
    build:
      args:
        GPU: "0"
    devices: []
    environment:
      - LLM_NGL=0

  embedder:
    build:
      args:
        GPU: "0"
    devices: []
    environment:
      - EMBEDDER_NGL=0

  reranker:
    build:
      args:
        GPU: "0"
    devices: []
    environment:
      - EMBEDDER_NGL=0

  trainer:
    devices: []
