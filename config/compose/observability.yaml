# Optional overlay: Prometheus + Grafana on a dedicated network, scraping
# /metrics that already live on the isolated core-net / tools-net.
#
# Use the same engine and compose files as the running agent. A second
# engine cannot resolve agent/tools/llm.
#
#   docker compose -f compose.yaml -f config/compose/docker.yaml -f state/compose.workspaces.yaml -f config/compose/observability.yaml --profile obs up -d prometheus grafana
#   podman compose -f compose.yaml -f state/compose.workspaces.yaml -f config/compose/observability.yaml --profile obs up -d prometheus grafana
#
# Do not publish agent or tools ports. Grafana is the only host-facing UI
# and it binds loopback only (http://127.0.0.1:3000). Set
# GRAFANA_ADMIN_PASSWORD in `.env` before the first start; Grafana keeps the
# first password that initializes the volume. Usage, dashboards, and the
# metric list: docs/guides/observability.md.

networks:
  obs-net: {}

volumes:
  prometheus-data: {}
  grafana-data: {}

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["obs"]
    networks: [core-net, tools-net, obs-net]
    environment:
      - LLM_MODEL_PATH=${LLM_MODEL_PATH:-/models/Qwen2.5-Coder-14B-Instruct-Q5_K_M.gguf}
    volumes:
      - ./config/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/observability/prometheus-entrypoint.sh:/etc/prometheus/entrypoint.sh:ro
      - prometheus-data:/prometheus
    entrypoint: ["/bin/sh", "/etc/prometheus/entrypoint.sh"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["obs"]
    networks: [obs-net]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/pumba.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped
