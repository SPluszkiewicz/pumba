global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: agent
    static_configs:
      - targets: ["agent:8090"]
  - job_name: tools
    static_configs:
      - targets: ["tools:8091"]
  # LLM_ROUTER=1 answers /metrics only when ?model= is the GGUF stem
  # (basename of LLM_MODEL_PATH, without .gguf). The placeholder is replaced
  # when the Prometheus container starts. A model loaded later from the page
  # is a different stem and is not scraped until LLM_MODEL_PATH matches it.
  - job_name: llm
    metrics_path: /metrics
    params:
      model:
        - __LLM_METRICS_MODEL__
    static_configs:
      - targets: ["llm:8080"]
  - job_name: embedder
    static_configs:
      - targets: ["embedder:8081"]
  - job_name: reranker
    static_configs:
      - targets: ["reranker:8082"]
  - job_name: qdrant
    static_configs:
      - targets: ["qdrant:6333"]
