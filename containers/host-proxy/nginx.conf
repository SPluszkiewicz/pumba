# Runs as the image's non-root user (nginxinc/nginx-unprivileged, uid 101)
# with every capability dropped: no `user` directive, a port above 1024,
# and every writable path under the /tmp tmpfs.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log off;
    client_max_body_size 1m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8090;
        location / {
            proxy_pass http://agent:8090;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_buffering off;
            # A long question is several hops. One hop is capped at 14400s;
            # the stream itself follows APP_REQUEST_TIMEOUT_SECONDS (172800)
            # so nginx is not what ends the turn.
            proxy_read_timeout 172800s;
            proxy_send_timeout 172800s;
        }
    }
}
