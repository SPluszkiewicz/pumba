site_name: Pumba
site_description: A RAG-based coding assistant, fully containerized and offline, built around a C++/CMake project.
docs_dir: docs

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - toc.integrate
  font: false   # do not fetch Google Fonts - fully offline

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - tables
  - toc:
      permalink: true

